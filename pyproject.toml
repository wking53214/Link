[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "link"
version = "0.1.0"
description = "Carries Triad-42 review output into CNS, with CCC holding the record."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "William N. King" }]
# Each dependency is pinned to an exact commit, except CNS, which is pinned to its release tag, so every install gets the same code.
dependencies = [
    "cognitive-continuity-constitution @ git+https://github.com/wking53214/CCC@be1a5124d5ddb789da4697ae0b5fa7f2567e50e4",
    "triad42 @ git+https://github.com/wking53214/Triad-42.git@58a2c7f9004fed0b9f26f93e3c6fddb68e907d5d",
    "cns @ git+https://github.com/wking53214/CNS.git@v2.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["link*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
