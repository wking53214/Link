[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "link"
version = "0.1.0"
description = "Carries Triad-42 review output into CNS, with CCC holding the record."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "William N. King" }]
# Each dependency is pinned to an exact commit, except CNS, which is pinned to its release tag, so every install gets the same code.
dependencies = [
    "cognitive-continuity-constitution @ git+https://github.com/wking53214/CCC@1f8e9b09820e221741588d87888dda170117c567",
    "triad42 @ git+https://github.com/wking53214/Triad-42.git@eb5d395aaf589e51ac46586e95c95669416f1de5",
    "cns @ git+https://github.com/wking53214/CNS.git@v2.3.0",
]

[project.optional-dependencies]
# CCC's text matcher. Needed by link.recurrence and link.calibration, not by admit_session.
match = ["cccb @ git+https://github.com/wking53214/CCCb.git@8e3c779ea8f932dd34a637bf2fcb0835cc7bc068"]
dev = ["pytest>=7", "ruff>=0.4", "link[match]"]

[tool.setuptools.packages.find]
include = ["link*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
